<style>
  :root { --bg: #000; --fg: #f3ead8; --or: #ff8f5e; --dim: rgba(243,234,216,.55); }

<script>
'use strict';
// =====================================================================================================
// 小克的一回合：你按下 Enter 之后，小克（Claude 的像素小螃蟹）做了什么。
// 画面全部由 render(t) 画出，只依赖 t（不用 Math.random / Date.now），所以预览和逐帧导出完全一致。
// 时间轴以小节为单位：120 BPM，一小节 = 2 秒。music.py 读 cues.json 里的段落和音效点来编曲。
// =====================================================================================================
const W = 1920, H = 1080, FPS = 30, BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4;
const EXPORT = /[?&]export=1/.test(location.search);
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eout = t => 1 - Math.pow(1 - clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eback = t => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const win = (t, a, b, fi = .4, fo = .4) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const F_ZH = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const F_MONO = '"Space Mono", "Consolas", "Menlo", monospace';
const F_BIG = '"Anton", "Impact", sans-serif';
const OR = '#ff8f5e', CLAUDE = '#d97757', CREAM = '#f3ead8', DIM = 'rgba(243,234,216,.55)', TEAL = '#5ee6d0', RED = '#ff4d5e', GREEN = '#7dff9a';
const INK = '#120a07';

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const OUTC = document.getElementById('c'), octx = OUTC.getContext('2d');
const LAYER = mk(W, H), lctx = LAYER.getContext('2d');
const ACC = mk(W, H), actx = ACC.getContext('2d');
const B1 = mk(480, 270), b1 = B1.getContext('2d');
const B2 = mk(240, 135), b2 = B2.getContext('2d');
let ctx = lctx;                     // 当前画布：场景画在 LAYER 上，叠加层（字幕、HUD）画在输出画布上
let FT = 0;                         // 当前这一帧的时间（运动模糊子帧之外的那个 t）

// ------------------------------------------------------------------------------------- 小工具
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 400} ${o.size || 40}px ${o.font || F_ZH}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 20; }
  ctx.fillStyle = o.color || CREAM;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, o = {}) {
  ctx.save(); ctx.font = `${o.weight || 400} ${o.size || 40}px ${o.font || F_ZH}`; if (o.ls) ctx.letterSpacing = o.ls + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
const WRAP = new Map();
function wrap(s, maxw, o = {}) {
  const key = s + '|' + maxw + '|' + (o.size || 40) + (o.weight || 400) + (o.font || '');
  if (WRAP.has(key)) return WRAP.get(key);
  const lines = []; let cur = '';
  for (const ch of s) { if (cur && measure(cur + ch, o) > maxw) { lines.push(cur); cur = ch.trim() ? ch : ''; } else cur += ch; }
  if (cur) lines.push(cur);
  WRAP.set(key, lines); return lines;
}
// 字被「故障」：红青错位
function glitchText(s, x, y, o, amt) {
  if (amt > .01) {
    const dx = 14 * amt * (hash(Math.floor(FT * 30) * 3.1) - .3);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    text(s, x - dx, y, { ...o, color: '#ff2a4a', alpha: (o.alpha ?? 1) * .8 });
    text(s, x + dx, y + 2 * amt, { ...o, color: '#2ad8ff', alpha: (o.alpha ?? 1) * .8 });
    ctx.restore();
  }
  text(s, x, y, o);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function panel(x, y, w, h, o = {}) {
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  rr(x, y, w, h, o.r ?? 18); ctx.fillStyle = o.fill || 'rgba(22,15,12,.86)'; ctx.fill();
  ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.stroke || 'rgba(255,143,94,.38)'; ctx.stroke();
  ctx.restore();
}
function glowDot(x, y, r, rgb, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.2, `rgba(${rgb},${a * .8})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function line(x0, y0, x1, y1, col, w = 2, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
}
const bez = (p0, p1, p2, p3, t) => { const u = 1 - t; return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3; };
const pulse = (t, k = 7) => Math.exp(-((t % BEAT + BEAT) % BEAT) * k);          // 每拍一下的冲击（底鼓）

// ------------------------------------------------------------------------------------- 背景
function synthBg(t, o = {}) {
  const hz = o.hz ?? 640, P = o.pulse ?? 0;
  let g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, '#05040a'); g.addColorStop(.62, '#170a15'); g.addColorStop(1, '#43170f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz);
  stars(t, 90, 7, hz * .8, .8);
  if (o.sun !== false) {
    const R = o.sunR ?? 250, cx = o.sunX ?? 960, cy = hz - (o.sunY ?? 40);
    glowDot(cx, cy, R * 2.2, '255,120,80', .22 + P * .08);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hz); ctx.clip();
    const sg = ctx.createLinearGradient(0, cy - R, 0, cy + R * .4);
    sg.addColorStop(0, '#ffe08a'); sg.addColorStop(.35, '#ff9a6a'); sg.addColorStop(.7, '#e8456e'); sg.addColorStop(1, '#8e2a7a');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    const step = R * .13, off = (t * 24) % step;
    for (let i = 0; i < 9; i++) {
      const yy = cy - R * .2 + i * step + off, hh = 2 + i * 2.2 * (yy - cy + R * .2) / (R);
      ctx.fillStyle = '#2d0f13'; ctx.fillRect(cx - R - 2, yy, 2 * R + 4, Math.max(1, hh));
    }
    ctx.restore();
  }
  ctx.fillStyle = '#070509'; ctx.fillRect(0, hz, W, H - hz);
  const hg = ctx.createLinearGradient(0, hz - 50, 0, hz + 80);
  hg.addColorStop(0, 'rgba(255,110,80,0)'); hg.addColorStop(.4, `rgba(255,120,80,${.45 + P * .25})`); hg.addColorStop(1, 'rgba(255,110,80,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, hz - 50, W, 130);
  ctx.save(); ctx.lineWidth = 2;
  const spd = o.speed ?? 1.1, ph = (t * spd) % 1;
  for (let i = 0; i < 26; i++) {
    const z = i + 1 - ph, y = hz + (H - hz) / (1 + z * .42), a = clamp((y - hz) / (H - hz) * 1.6) * (.55 + P * .45);
    ctx.strokeStyle = `rgba(255,${110 + P * 60},${90 + P * 40},${a})`;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let k = -22; k <= 22; k++) {
    ctx.strokeStyle = `rgba(255,110,90,${.32 + P * .2})`;
    ctx.beginPath(); ctx.moveTo(960 + k * 34, hz); ctx.lineTo(960 + k * 360, H + 40); ctx.stroke();
  }
  ctx.restore();
}
function stars(t, n, seed, maxY = H, a = 1) {
  ctx.save();
  for (let i = 0; i < n; i++) {
    const x = hash(seed * 31 + i) * W, y = hash(seed * 17 + i * 1.7) * maxY, tw = .4 + .6 * Math.abs(Math.sin(t * (1 + hash(i) * 2) + i));
    ctx.globalAlpha = a * tw * (.3 + hash(i * 3.3) * .7); ctx.fillStyle = CREAM;
    const s = 1 + (hash(i * 9.1) > .9 ? 1.5 : 0); ctx.fillRect(x, y, s, s);
  }
  ctx.restore();
}
function dust(t, n, seed, o = {}) {
  ctx.save();
  for (let i = 0; i < n; i++) {
    const vx = (hash(seed + i * 2.1) - .5) * 40 + (o.vx || 0), vy = -12 - hash(seed + i * 5.3) * 30 + (o.vy || 0);
    const x = ((hash(seed + i) * W + t * vx) % W + W) % W, y = ((hash(seed + i * 7.7) * H + t * vy) % H + H) % H;
    ctx.globalAlpha = (o.a ?? .5) * (.3 + .7 * hash(i * 1.37)) * (.6 + .4 * Math.sin(t * 2 + i));
    ctx.fillStyle = o.color || OR; const s = 1.5 + hash(i * 4.4) * 2.5; ctx.fillRect(x, y, s, s);
  }
  ctx.restore();
}
function darkBg(t, o = {}) {
  const g = ctx.createRadialGradient(W / 2, H * .45, 50, W / 2, H / 2, W * .75);
  g.addColorStop(0, o.c0 || '#1d0f0b'); g.addColorStop(1, o.c1 || '#050404');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (o.grid !== false) {   // 很淡的点阵
    ctx.save(); ctx.fillStyle = 'rgba(255,143,94,.10)';
    const off = (t * 10) % 48;
    for (let x = -48; x < W + 48; x += 48) for (let y = -48; y < H + 48; y += 48) ctx.fillRect(x + off, y, 2, 2);
    ctx.restore();
  }
}

// ------------------------------------------------------------------------------------- 小克
//  ▐▛███▜▌
// ▝▜█████▛▘     照着 Claude Code 欢迎页那只像素小螃蟹：18 × 10 个方块（终端里一格是两个方块高）
//   ▘▘ ▝▝
const CLAWD = (() => {
  const a = [], add = (gx, gy, part) => a.push({ gx, gy, part, i: a.length });
  for (let r = 0; r < 4; r++) for (let gx = 3; gx <= 14; gx++) for (let s = 0; s < 2; s++) add(gx, r * 2 + s, 'body');
  for (const gx of [1, 2]) for (let s = 0; s < 2; s++) add(gx, 4 + s, 'armL');
  for (const gx of [15, 16]) for (let s = 0; s < 2; s++) add(gx, 4 + s, 'armR');
  [4, 6, 11, 13].forEach((gx, li) => { for (let s = 0; s < 2; s++) add(gx, 8 + s, 'leg' + li); });
  return a;
})();
function clawd(x, y, u, o = {}) {
  const as = o.assemble ?? 1, lp = Math.sin((o.walk || 0) * TAU), seed = o.seed || 1;
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.squash) { ctx.translate(x, y + 5 * u); ctx.scale(1 + o.squash * .5, 1 - o.squash); ctx.translate(-x, -y - 5 * u); }
  if (o.glow) glowDot(x, y, u * 16, '255,130,90', o.glow * .35);
  if (o.outline && as >= 1) {            // 深色描边：站在亮的背景（太阳）前面也看得清
    const ow = u * o.outline; ctx.fillStyle = INK;
    ctx.fillRect(x - 6 * u - ow, y - 5 * u - ow, 12 * u + 2 * ow, 8 * u + 2 * ow);
    ctx.fillRect(x - 8 * u - ow, y - 1 * u - ow - (o.arms || 0) * u * 1.4 - (o.wave || 0) * u * 2, 2 * u + 2 * ow, 2 * u + 2 * ow);
    ctx.fillRect(x + 6 * u - ow, y - 1 * u - ow - (o.arms || 0) * u * 1.4, 2 * u + 2 * ow, 2 * u + 2 * ow);
    for (const gx of [4, 6, 11, 13]) ctx.fillRect(x + (gx - 9) * u - ow, y + 3 * u - ow, u + 2 * ow, 2 * u + 2 * ow);
  }
  ctx.fillStyle = o.color || OR;
  for (const s of CLAWD) {
    let px = x + (s.gx - 9) * u, py = y + (s.gy - 5) * u, sz = u + .7;
    if (s.part === 'armL') py -= (o.arms || 0) * u * 1.4 + (o.wave || 0) * u * 2;
    if (s.part === 'armR') py -= (o.arms || 0) * u * 1.4 + (o.waveR || 0) * u * 2;
    if (s.part[0] === 'l' && s.part[1] === 'e') { const li = +s.part[3]; py -= Math.max(0, li % 2 ? -lp : lp) * u * .9; }
    if (as < 1) {
      const d = hash(s.i * 1.91 + seed) * .45, k = eout((as - d) / .55);
      if (k <= 0) continue;
      const ang = hash(s.i * 3.7 + seed) * TAU, r = (o.spread || 900) * (.4 + hash(s.i * 5.1 + seed) * .6);
      px = lerp(x + Math.cos(ang) * r, px, k); py = lerp(y + Math.sin(ang) * r, py, k);
      sz *= .3 + .7 * k;
      ctx.globalAlpha = (o.alpha ?? 1) * clamp(k * 2);
    }
    ctx.fillRect(px, py, sz, sz);
  }
  ctx.globalAlpha = o.alpha ?? 1;
  if (as > .92) {                     // 眼睛
    const ea = clamp((as - .92) / .08);
    for (const gx of [5, 12]) {
      const ex = x + (gx - 9 + (o.look || 0) * .35) * u, ey = y + (2 - 5) * u;
      ctx.globalAlpha = (o.alpha ?? 1) * ea; ctx.fillStyle = INK;
      if (o.blink > .5) ctx.fillRect(ex, ey + u * 1.4, u + .5, u * .6);
      else {
        ctx.fillRect(ex, ey, u + .5, 2 * u + .5);
        ctx.fillStyle = CREAM; ctx.fillRect(ex + u * .15, ey + u * .2, u * .38, u * .5);
      }
    }
  }
  ctx.restore();
}
const blinkAt = (t, period = 3.3, off = 0) => ((t + off) % period) < .12 ? 1 : 0;

// ------------------------------------------------------------------------------------- 文字素材（都是这一回合真实发生的事）
const MSG1 = '小克小克 你在我問你問題的時候做了哪些事情哇 可以給我做個視頻看看嘛 拿你的可愛小螃蟹形象';
const MSG2 = '可以再炫酷一點呀 然後再長一點 具體一點 然後實現方法可以像png無損去導出哦 實現方式類似於 abstract-algebra-promo 一樣';
const TYPE0 = 1.0, TYPE_CPS = 17, TYPE_END = TYPE0 + [...MSG2].length / TYPE_CPS, ENTER = TYPE_END + .5;
const TOOLS = ['Bash', 'Read', 'Edit', 'Write', 'Grep', 'Glob', 'Agent', 'WebSearch', '+ 30…'];
const CTX_BLOCKS = [
  { tag: 'SYSTEM', zh: '系統提示', body: '我是誰 · 做事原則 · 什麼要先問你 · 怎麼回報' },
  { tag: 'TOOLS', zh: '工具定義', body: null },
  { tag: 'ENV', zh: '環境', body: '倉庫 dangaow/damn · 分支 ccr-1eb0ef20-a63hi9 · Linux · 2026-10-11' },
  { tag: 'HISTORY', zh: '前情', body: '上一回合：46 秒小影片 · 1374 幀 · Python PIL 畫圖 + ffmpeg' },
  { tag: 'YOU', zh: '你的訊息', body: '可以再炫酷一點呀 然後再長一點 具體一點 …PNG 無損導出…' },
];
const KEYWORDS = ['更炫酷', '更長', '更具體', 'PNG 無損導出', '照 abstract-algebra-promo 的做法'];
const PLAN = ['讀懂範例倉庫怎麼做', '對照你的 mv/ 慣例', '分鏡：10 段 · 2 分半', '畫面：HTML Canvas 逐幀', '音樂：Python 合成', '導出：Chrome → PNG → FFmpeg'];
const CALLS = [
  ['git clone --depth 1 …/abstract-algebra-promo', '16 個檔案 · 28 MB'],
  ['cat README.md export.mjs build.py', '畫面 Canvas 逐幀 → 無頭 Chrome → FFmpeg'],
  ['grep -n "__frame" promo.html', '__frame(t) → canvas.toDataURL(…)'],
  ['ls mv mv2', '咦？你的 mv/ 早就是同一套做法'],
  ['cat mv/export.mjs', '已經有 --png：無損傳幀'],

];
const LOOP_NODES = [['想', 'THINK'], ['呼叫工具', 'CALL'], ['讀結果', 'READ'], ['下一步？', 'DECIDE']];
const LOOP_JOBS = ['讀 README', '讀 export.mjs', '看 mv/', '查 Chromium', '下載字型', '寫分鏡', '寫 clawd.html', '寫 music.py', '寫 export.mjs', '截圖檢查', '修畫面', '導出 PNG', '合成 MP4', 'commit'];
const FINAL_CALLS = 46;            // 这一回合实际的工具调用次数（做完后数的）
const LOOP_W0 = 1.2, LOOP_A = .55, LOOP_END = 12;
const loopAng = lt => LOOP_W0 * lt + .5 * LOOP_A * lt * lt;

// ------------------------------------------------------------------------------------- 场景
// 每个场景：bars 小节数、mus 编曲段落（music.py 用）、kick 有没有底鼓（画面跟拍）、subs 字幕、sfx 音效点
function sCold(lt, d, t) {
  ctx.fillStyle = '#050404'; ctx.fillRect(0, 0, W, H);
  dust(t, 40, 3, { a: .25 });
  const k = sstep(ENTER + .2, d - .4, lt);                                            // 送出后整个画面被吸进一个点
  ctx.save();
  const s = lerp(1, .02, eio(k)); ctx.translate(960, 540); ctx.scale(s, s); ctx.translate(-960, -540);
  ctx.globalAlpha = 1 - sstep(.75, 1, k);
  const a0 = sstep(.1, .9, lt);
  // 上一回合（淡淡的）
  const l1 = wrap(MSG1, 760, { size: 28 });
  panel(1840 - 820, 150, 820, 30 + l1.length * 42, { alpha: .45 * a0, fill: 'rgba(80,36,22,.6)' });

function sLoop(lt, d, t) {

  ctx.strokeStyle = 'rgba(255,143,94,.12)'; ctx.lineWidth = 30; ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();
  ctx.restore();
  const L = Math.min(lt, LOOP_END), ang = -PI / 2 + loopAng(L), w = LOOP_W0 + LOOP_A * L;

    ctx.beginPath(); ctx.arc(CX, CY, R, a1, a0); ctx.stroke();
  }
  ctx.restore();
  LOOP_NODES.forEach(([zh, en], k) => {
    const a = -PI / 2 + k * PI / 2, nx = CX + Math.cos(a) * R, ny = CY + Math.sin(a) * R;
    const dd = Math.abs(((ang - a) % TAU + TAU + PI) % TAU - PI);

    text(zh, nx, ny - 8, { size: 34, weight: 700, alpha: ringA, color: on > .5 ? '#fff' : CREAM });
    text(en, nx, ny + 26, { size: 14, font: F_MONO, ls: 4, alpha: ringA, color: on > .5 ? '#fff' : OR });
  });

  }

    sfx: [[0, 'hit', { k: .5 }], ...(() => { const a = []; for (let m = 1; m < 80; m++) { const tm = (-LOOP_W0 + Math.sqrt(LOOP_W0 ** 2 + 2 * LOOP_A * m * PI / 2)) / LOOP_A; if (tm >= LOOP_END) break; a.push([tm, 'tick', { hi: m % 4 === 0 }]); } return a; })(),
          [LOOP_END, 'whoosh'], [LOOP_END + .1, 'glitch'], [LOOP_END + 1.1, 'hit', { k: .5 }], [16, 'riser', { dur: 2 }]] },
  { id: 'render', bars: 14, mus: 'drop2', kick: true, draw: sRender, ch: ['05', '逐幀', 'FRAME BY FRAME'], hud: true, glitch: true, bloom: 1.15,
    subs: [[.6, 7, '整支影片是一個函式：給它時間 t，它畫出那一格', 'FRAME = render(t)'],
           [7.2, 15, '無頭 Chrome 一格一格算，用 PNG 無損交給 FFmpeg', 'LOSSLESS PNG → FFMPEG'],
           [15.2, 21, '每格再算 3 個子幀疊起來，動起來才有殘影', 'MOTION BLUR FROM SUB-FRAMES'],
           [21.2, 27.6, '連音樂都是 Python 一個取樣一個取樣算出來的', 'THE MUSIC IS SYNTHESIZED TOO']],
    sfx: [[0, 'hit', { k: 1 }], [7, 'whoosh'], ...Array.from({ length: 22 }, (_, j) => [7.4 + j * .3 + 1.5, 'shutter']), [15, 'whoosh'], [17.2, 'glitch'], [21, 'hit', { k: .6 }]] },
  { id: 'check', bars: 6, mus: 'break2', kick: false, draw: sCheck, bloom: .12, ch: ['06', '檢查', 'REVIEW'], hud: true,
    subs: [[.6, 5, '交出去之前，先抽幾幀出來自己看', 'SPOT-CHECK THE FRAMES'],
           [5.2, 11.6, '上一版就這樣抓到：卡片太窄、字跑出去了 —— 修好才交', 'FOUND IT. FIXED IT.']],
    sfx: [...THUMBS.map((x, i) => [.2 + i * .08, 'tick']), [4.2, 'whoosh'], [5.1, 'error'], [7.6, 'fix'], [10.2, 'whoosh']] },
  { id: 'deliver', bars: 6, mus: 'build2', kick: true, draw: sDeliver, ch: ['07', '交付', 'SHIP IT'], hud: true, glitch: true,
    subs: [[.6, 6, '計畫逐項打勾；原始碼 commit、push 到你的分支', 'COMMIT · PUSH'],
           [6.2, 11.6, '影片傳給你，再老實報告：做了什麼、哪裡沒做到', 'DELIVER · REPORT HONESTLY']],
    sfx: [...PLAN.map((p, i) => [.7 + i * .42, 'tick']), [3.3, 'chime'], [4.6, 'send'], [6.3, 'send'], [8.4, 'fix'], [11, 'riser', { dur: 1 }]] },
  { id: 'outro', bars: 7, mus: 'outro', kick: false, draw: sOutro, lb: true, hud: false, fo: 2.2,
    subs: [], sfx: [[0, 'hit', { k: .8 }], [5.6, 'hit', { k: .5 }], [8.6, 'chime']] },
];
let acc = 0;
for (const s of SC) { s.t0 = acc; s.d = s.bars * BAR; acc += s.d; }
const TOTAL = acc;
const SUBS = SC.flatMap(s => s.subs.map(([a, b, zh, en]) => ({ a: s.t0 + a, b: s.t0 + b, zh, en })));
const CUES = SC.flatMap(s => s.sfx.map(([t, name, o]) => ({ t: +(s.t0 + t).toFixed(4), name, ...(o || {}) }))).sort((a, b) => a.t - b.t);
// 打字声：每个字一下
for (let i = 0; i < [...MSG2].length; i++) if ([...MSG2][i] !== ' ') CUES.push({ t: +(TYPE0 + i / TYPE_CPS).toFixed(4), name: 'type', n: i });
CUES.push({ t: +ENTER.toFixed(4), name: 'enter' }, { t: +(ENTER + .3).toFixed(4), name: 'riser', dur: +(SC[1].t0 - ENTER - .3).toFixed(3) });
CUES.sort((a, b) => a.t - b.t);
const HITS = CUES.filter(c => c.name === 'hit').map(c => [c.t, c.k ?? 1]);
const sceneAt = t => { let sc = SC[0]; for (const s of SC) if (t >= s.t0) sc = s; return sc; };
const toolCalls = T => {           // HUD 上的工具调用次数
  const sT = SC[4], sL = SC[5], sR = SC[6], sK = SC[8];
  if (T < sT.t0) return 0;
  if (T < sL.t0) return CALLS.filter((c, i) => T - sT.t0 > 1.2 + i * 2.6).length;
  const lc = Math.floor((loopAng(Math.min(T - sL.t0, LOOP_END)) + PI / 2) / TAU);
  if (T < sR.t0) return CALLS.length + lc;
  const base = CALLS.length + Math.floor((loopAng(LOOP_END) + PI / 2) / TAU);
  return Math.round(lerp(base, FINAL_CALLS, clamp((T - sR.t0) / (sK.t0 + 5 - sR.t0))));
};

// ------------------------------------------------------------------------------------- 一帧
function drawLayer(t) {
  ctx = lctx;
  const sc = sceneAt(t), lt = t - sc.t0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let shake = 0;
  for (const [th, k] of HITS) if (t >= th && t < th + 1.2) shake += 18 * k * Math.exp(-(t - th) * 7);
  const cam = sc.cam ? sc.cam(lt, sc.d) : { z: 1 + .035 * lt / sc.d, x: 0, y: 0 };
  ctx.save();
  ctx.translate(W / 2 + (cam.x || 0) + (shake > .3 ? Math.sin(t * 91) * shake : 0), H / 2 + (cam.y || 0) + (shake > .3 ? Math.cos(t * 73) * shake : 0));
  ctx.scale(cam.z, cam.z); ctx.translate(-W / 2, -H / 2);
  sc.draw(lt, sc.d, t);
  ctx.restore();
  const fade = 1 - win(lt, 0, sc.d, sc.fi ?? .3, sc.fo ?? .3);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
// 胶片颗粒、扫描线、暗角：预先生成
const GRAIN = Array.from({ length: 4 }, (_, k) => {
  const c = mk(256, 256), g = c.getContext('2d'), im = g.createImageData(256, 256), rnd = mulberry(100 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});
const SCAN = (() => { const c = mk(4, 4), g = c.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, 0, 4, 1); return c; })();
const VIG = (() => { const c = mk(W, H), g = c.getContext('2d'), r = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .7); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = r; g.fillRect(0, 0, W, H); return c; })();

function post(T, sc) {
  const lt = T - sc.t0;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalAlpha = 1; octx.globalCompositeOperation = 'copy'; octx.filter = 'none';
  octx.drawImage(ACC, 0, 0); octx.globalCompositeOperation = 'source-over';
  // 辉光：只留亮部，缩小模糊后叠加
  b1.globalCompositeOperation = 'copy'; b1.filter = 'brightness(.85) contrast(2.4) blur(4px)'; b1.drawImage(ACC, 0, 0, 480, 270); b1.filter = 'none';
  b2.globalCompositeOperation = 'copy'; b2.filter = 'blur(5px)'; b2.drawImage(B1, 0, 0, 240, 135); b2.filter = 'none';
  octx.globalCompositeOperation = 'lighter';
  const bl = sc.bloom ?? 1;
  octx.globalAlpha = .55 * bl; octx.drawImage(B1, 0, 0, W, H);
  octx.globalAlpha = .45 * bl; octx.drawImage(B2, 0, 0, W, H);
  // 转场故障：横条错位
  if (sc.glitch && lt < .28) {
    const k = 1 - lt / .28, rnd = mulberry(Math.floor(T * FPS) + 7);
    octx.globalAlpha = 1; octx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 9; i++) { const y = rnd() * H, h = 10 + rnd() * 70, dx = (rnd() - .5) * 220 * k; octx.drawImage(OUTC, 0, y, W, h, dx, y, W, h); }
  }
  octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1; octx.drawImage(VIG, 0, 0);
  octx.globalCompositeOperation = 'overlay'; octx.globalAlpha = .07;
  const gi = Math.floor(T * FPS) % 4, gp = octx.createPattern(GRAIN[gi], 'repeat');
  octx.save(); octx.translate(hash(Math.floor(T * FPS)) * 256, hash(Math.floor(T * FPS) + .5) * 256); octx.fillStyle = gp; octx.fillRect(-256, -256, W + 512, H + 512); octx.restore();
  octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = .5; octx.fillStyle = octx.createPattern(SCAN, 'repeat'); octx.fillRect(0, 0, W, H);
  octx.globalAlpha = 1;
}
function chapter(sc, lt) {
  if (!sc.ch) return;
  const a = win(lt, .4, 5.4, .5, .8); if (a <= 0) return;
  const [n, zh, en] = sc.ch, x = 90, y = 96, slide = (1 - eout((lt - .4) / .8)) * -40;
  const nw = measure(n, { size: 72, font: F_BIG });
  text(n, x + slide, y, { size: 72, font: F_BIG, color: OR, alpha: a, align: 'left', glow: 'rgba(255,120,80,.7)', blur: 20 });
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = OR; ctx.fillRect(x + nw + 22 + slide, y - 32, 3, 64); ctx.restore();
  text(zh, x + nw + 46 + slide, y - 12, { size: 40, weight: 900, alpha: a, align: 'left' });
  text(en, x + nw + 48 + slide, y + 26, { size: 16, font: F_MONO, ls: 6, color: '#e8b89a', alpha: a, align: 'left' });
}
function hud(T, sc) {
  if (!sc.hud) return;
  const a = win(T - sc.t0, 0, sc.d, .3, .3);
  const x = 1830, f = Math.round(T * FPS), mm = Math.floor(T / 60), ss = (T % 60).toFixed(2).padStart(5, '0');
  if (Math.floor(T * 1.5) % 2 === 0) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(x - 300, 66, 7, 0, TAU); ctx.fill(); ctx.restore(); }
  text(`FRAME ${String(f).padStart(5, '0')} / ${Math.round(TOTAL * FPS)}`, x, 66, { size: 18, font: F_MONO, align: 'right', alpha: a * .9 });
  text(`T+ ${mm}:${ss}`, x, 94, { size: 18, font: F_MONO, align: 'right', alpha: a * .7 });
  text(`TOOL CALLS ${String(toolCalls(T)).padStart(2, '0')}`, x, 122, { size: 18, font: F_MONO, align: 'right', color: OR, alpha: a });
}
function subtitles(T) {
  for (const s of SUBS) {
    if (T < s.a - .3 || T > s.b + .3) continue;
    const a = win(T, s.a, s.b, .25, .3); if (a <= 0) continue;
    ctx.save(); const g = ctx.createLinearGradient(0, 860, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${.7 * a})`); ctx.fillStyle = g; ctx.fillRect(0, 860, W, 220); ctx.restore();
    text(s.zh, W / 2, 978, { size: 42, weight: 700, alpha: a, glow: 'rgba(0,0,0,.9)', blur: 12, ls: 2 });
    text(s.en, W / 2, 1030, { size: 18, font: F_MONO, ls: 6, color: '#e8b89a', alpha: a * .85 });
  }
}
function overlays(T, sc) {
  ctx = octx;
  const lt = T - sc.t0;
  if (sc.lb) {
    const lb = sc.id === 'cold' ? 120 * (1 - sstep(sc.d - .6, sc.d, lt)) : 120 * eio((lt - 8.4) / 1.2) + 0;
    if (lb > .5) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, lb); ctx.fillRect(0, H - lb, W, lb); }
  }
  chapter(sc, lt); hud(T, sc); subtitles(T);
  let flash = 0; for (const [th, k] of HITS) if (T >= th && T < th + 1) flash += .7 * k * Math.exp(-(T - th) * 6);
  if (flash > .01) { ctx.fillStyle = `rgba(255,236,220,${Math.min(.85, flash)})`; ctx.fillRect(0, 0, W, H); }
  if (sc.id === 'outro') { const f = sstep(sc.d - 2, sc.d - .2, lt); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); } }
  ctx = lctx;
}
const SHUTTER = .5;
function render(T, samples = 1) {
  T = clamp(T, 0, TOTAL - 1e-4); FT = T;
  const sc = sceneAt(T), K = Math.max(1, samples);
  for (let k = 0; k < K; k++) {
    let tk = K > 1 ? Math.max(0, T + ((k + .5) / K - .5) * SHUTTER / FPS) : T;
    if (sceneAt(tk) !== sc) tk = T;
    drawLayer(tk);
    actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1 / (k + 1); actx.drawImage(LAYER, 0, 0);
  }
  actx.globalAlpha = 1;
  post(T, sc);
  overlays(T, sc);
}

// ------------------------------------------------------------------------------------- 字体、播放、导出接口
let fontsReady = false;
Promise.all(['400 40px "Noto Sans TC"', '700 40px "Noto Sans TC"', '900 40px "Noto Sans TC"', '400 40px "Space Mono"', '700 40px "Space Mono"', '40px "Anton"'].map(f => document.fonts.load(f, '小克一回合ABC123')))
  .catch(() => {}).then(() => document.fonts.ready).then(() => { fontsReady = true; const l = document.getElementById('load'); if (l) l.textContent = '字型就緒 · 建議全螢幕（F）'; WRAP.clear(); render(0); });
setTimeout(() => { fontsReady = true; }, 15000);

window.__ready = () => fontsReady;
window.__frame = (t, samples = 3, png = true) => { render(t, samples); return png ? OUTC.toDataURL('image/png') : OUTC.toDataURL('image/jpeg', .92); };
window.__info = () => ({ duration: TOTAL, fps: FPS, frames: Math.round(TOTAL * FPS), bpm: BPM });
window.__cues = () => ({ bpm: BPM, bar: BAR, total: TOTAL, scenes: SC.map(s => ({ id: s.id, t0: s.t0, d: s.d, bars: s.bars, mus: s.mus })), sfx: CUES });

const au = document.getElementById('au');
au.src = (window.EMBED && window.EMBED.audio) ? 'data:audio/mpeg;base64,' + window.EMBED.audio : 'music.mp3';
if (EXPORT) { document.getElementById('start').remove(); document.getElementById('ui').remove(); }
else {
  let playing = false, clock0 = 0, useAudio = true, hideT = 0;
  const ui = document.getElementById('ui'), pp = document.getElementById('pp'), fill = document.getElementById('fill'), tm = document.getElementById('tm');
  document.getElementById('dur').textContent = `${Math.floor(TOTAL / 60)}:${String(Math.round(TOTAL % 60)).padStart(2, '0')}`;
  const now = () => useAudio ? au.currentTime : (performance.now() - clock0) / 1000;
  function loop() {
    const T = now(); render(T);
    fill.style.width = (T / TOTAL * 100) + '%'; tm.textContent = `${Math.floor(T / 60)}:${String(Math.floor(T % 60)).padStart(2, '0')}`;
    if (T >= TOTAL - .05) { playing = false; pp.textContent = '▶'; }
    if (playing) requestAnimationFrame(loop);
  }
  function play() { playing = true; pp.textContent = '❚❚'; au.play().catch(() => { useAudio = false; clock0 = performance.now() - au.currentTime * 1000; }); requestAnimationFrame(loop); }
  function pause() { playing = false; pp.textContent = '▶'; au.pause(); }
  document.getElementById('go').onclick = () => { document.getElementById('start').remove(); if (au.currentTime >= TOTAL - .1) au.currentTime = 0; play(); poke(); };
  pp.onclick = () => playing ? pause() : play();
  document.getElementById('bar').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); au.currentTime = clamp((e.clientX - r.left) / r.width) * TOTAL; if (!useAudio) clock0 = performance.now() - au.currentTime * 1000; if (!playing) render(au.currentTime); };
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  function poke() { ui.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => ui.classList.add('hide'), 2200); }
  addEventListener('mousemove', poke);
  addEventListener('keydown', e => {
    if (document.getElementById('start')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'KeyF') document.getElementById('fs').click();
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { au.currentTime = clamp(au.currentTime + (e.code === 'ArrowRight' ? 5 : -5), 0, TOTAL); if (!useAudio) clock0 = performance.now() - au.currentTime * 1000; if (!playing) render(au.currentTime); }
    poke();
  });
}
