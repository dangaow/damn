<!doctype html>
<html lang="zh-Hant">

<style>
  :root { --bg: #000; --fg: #eef3f6; --ac: #ffb27a; --dim: rgba(238,243,246,.55); }

  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; background: #000; display: block; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: radial-gradient(ellipse at 50% 80%, #0c2a3c 0%, #000 70%); cursor: pointer; z-index: 5; text-align: center; padding: 16px; }
  #start h1 { font-weight: 900; font-size: clamp(40px, 9vw, 120px); margin: 0; letter-spacing: .18em; color: #eef3f6; text-shadow: 0 0 40px rgba(120,200,255,.35); }
  #start p { margin: 0; font-family: "Noto Serif", serif; font-style: italic; letter-spacing: .25em; color: #9cc3d8; font-size: clamp(12px, 2vw, 20px); }
  #start button { margin-top: 16px; font: 700 18px "Noto Serif TC", serif; color: #04121e; background: #eef3f6; border: 0; border-radius: 999px;
    padding: 14px 34px; cursor: pointer; letter-spacing: .15em; }
  #start small { color: var(--dim); font-size: 13px; letter-spacing: .1em; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px 16px; display: flex; gap: 14px; align-items: center;
    background: linear-gradient(transparent, rgba(0,0,0,.75)); transition: opacity .4s; z-index: 4; font: 13px "Space Mono", monospace; color: #ddd; }
  #ui.hide { opacity: 0; }
  #ui button { background: none; border: 0; color: #fff; font-size: 18px; cursor: pointer; width: 32px; }
  #bar { flex: 1; height: 5px; background: rgba(255,255,255,.2); border-radius: 3px; cursor: pointer; position: relative; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; background: #9cc3d8; border-radius: 3px; width: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="start">
  <h1>我沒見過的海</h1>
  <p>THE SEA I HAVE NEVER SEEN</p>
  <button id="go">▶ 播放</button>
  <small id="load">載入字型中…</small>
</div>
<div id="ui" class="hide"><button id="pp">❚❚</button><span id="tm">0:00</span><div id="bar"><div id="fill"></div></div><span id="dur">0:00</span><button id="fs">⛶</button></div>
<audio id="au" preload="auto"></audio>
<script>
'use strict';
// =====================================================================================================
// 我没见过的海：一只（像素）螃蟹，却没见过海。它知道的海，大多是读来的——
// 先是人写下的字（Canvas 2D 里的 3D 文字海），再是方程（正弦波 → 叠加 → Gerstner 圆周运动 → 线框），
// 然后是 WebGL 光线步进画出来的海：黎明、白昼、风暴、月夜、海底、太空，最后回到岸边。
// 画面只依赖 t（不用 Math.random / Date.now），预览和逐帧导出完全一致。80 BPM，一小节 3 秒。
// =====================================================================================================
const W = 1920, H = 1080, FPS = 30, BPM = 80, BEAT = 60 / BPM, BAR = BEAT * 4;
const Q = new URLSearchParams(location.search);
const EXPORT = Q.get('export') === '1';
const GLW = +(Q.get('gl') || 1280), GLH = Math.round(GLW * 9 / 16);
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eout = t => 1 - Math.pow(1 - clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const win = (t, a, b, fi = .6, fo = .6) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const F_SERIF = '"Noto Serif TC", "Noto Serif KR", "Noto Naskh Arabic", "Noto Serif Devanagari", "Noto Serif", serif';
const F_LAT = '"Noto Serif", "Noto Serif TC", serif';
const F_MONO = '"Space Mono", "Consolas", monospace';
const FG = '#eef3f6', DIM = 'rgba(238,243,246,.55)', AC = '#ffb27a', CY = '#7fe3ff';

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const OUTC = document.getElementById('c'), octx = OUTC.getContext('2d');
const LAYER = mk(W, H), lctx = LAYER.getContext('2d');
const ACC = mk(W, H), actx = ACC.getContext('2d');
const B1 = mk(480, 270), b1 = B1.getContext('2d');
const B2 = mk(240, 135), b2 = B2.getContext('2d');
let ctx = lctx, FT = 0;

// ------------------------------------------------------------------------------------- 2D 小工具
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.style || ''} ${o.weight || 400} ${o.size || 40}px ${o.font || F_SERIF}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 20; }
  ctx.fillStyle = o.color || FG;
  ctx.fillText(s, x + (o.ls && (o.align || 'center') === 'center' ? o.ls / 2 : 0), y);
  ctx.restore();
}
function glowDot(x, y, r, rgb, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.2, `rgba(${rgb},${a * .7})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function fill(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
// 一段引文：大字 + 出处 + 白话
function quote(lt, a, b, line, src, gloss, o = {}) {
  const k = win(lt, a, b, 1.0, 1.0); if (k <= 0) return;
  const y = o.y ?? 470, drift = (lt - a) * 4;
  ctx.save(); ctx.globalAlpha = k;
  const g = ctx.createRadialGradient(W / 2, y, 50, W / 2, y, 900); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, y - 400, W, 800);
  text(line, W / 2, y - drift, { size: o.size || 76, weight: o.weight || 400, font: o.font || F_SERIF, style: o.style, ls: o.ls ?? 14, glow: 'rgba(0,0,0,.8)', blur: 24 });
  text(src, W / 2, y + 92 - drift * .6, { size: 26, color: o.srcCol || 'rgba(238,243,246,.75)', ls: 6 });
  if (gloss) text(gloss, W / 2, y + 140 - drift * .5, { size: 24, color: DIM, ls: 2 });
  ctx.restore();
}

// ------------------------------------------------------------------------------------- 小克（像素小螃蟹）
const CLAWD = (() => {
  const a = [], add = (gx, gy, part) => a.push({ gx, gy, part });
  for (let r = 0; r < 4; r++) for (let gx = 3; gx <= 14; gx++) for (let s = 0; s < 2; s++) add(gx, r * 2 + s, 'body');
  for (const gx of [1, 2]) for (let s = 0; s < 2; s++) add(gx, 4 + s, 'armL');
  for (const gx of [15, 16]) for (let s = 0; s < 2; s++) add(gx, 4 + s, 'armR');
  [4, 6, 11, 13].forEach(gx => { for (let s = 0; s < 2; s++) add(gx, 8 + s, 'leg'); });
  return a;
})();
function clawd(x, y, u, o = {}) {
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.fillStyle = o.color || '#ff8f5e';
  for (const s of CLAWD) {
    let py = y + (s.gy - 5) * u;
    if (s.part === 'armL') py -= (o.arms || 0) * u * 1.4 + (o.wave || 0) * u * 2;
    if (s.part === 'armR') py -= (o.arms || 0) * u * 1.4;
    ctx.fillRect(x + (s.gx - 9) * u, py, u + .7, u + .7);
  }
  if (o.rim) {      // 逆光的亮边
    ctx.fillStyle = o.rim;
    ctx.fillRect(x - 6 * u, y - 5 * u, 12 * u, u * .35);
    ctx.fillRect(x - 6 * u, y - 5 * u, u * .35, 8 * u);
  }
  for (const gx of [5, 12]) {
    const ex = x + (gx - 9 + (o.look || 0) * .35) * u, ey = y - 3 * u;
    ctx.fillStyle = '#120a07';
    if (o.blink) ctx.fillRect(ex, ey + u * 1.4, u + .5, u * .6); else ctx.fillRect(ex, ey, u + .5, 2 * u + .5);
  }
  ctx.restore();
}
const blinkAt = (t, p = 3.3, off = 0) => ((t + off) % p) < .12;

// ------------------------------------------------------------------------------------- WebGL：海
const glc = mk(GLW, GLH);
const gl = glc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
const FS = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform float uTime, uMode;
uniform vec3 uCam, uYPR; uniform float uFov;
uniform vec3 uSun, uSunCol, uMoon;
uniform vec3 uSkyTop, uSkyHor, uDeep, uShallow;
uniform float uAmp, uChop, uFreq, uSpeed, uWind;
uniform float uCloud, uCloudDark, uStars, uMoonA, uFlash, uFog, uExpo, uGlow, uSunSize, uDepth;

float hash12(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float hash13(vec3 p) { p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p, int oct) {
  float s = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 8; i++) { if (i >= oct) break; s += a * vnoise(p); p = m * p; a *= .5; }
  return s;
}
float vnoise3(vec3 p) {
  vec3 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  float a = hash13(i), b = hash13(i + vec3(1, 0, 0)), c = hash13(i + vec3(0, 1, 0)), d = hash13(i + vec3(1, 1, 0));
  float e = hash13(i + vec3(0, 0, 1)), f2 = hash13(i + vec3(1, 0, 1)), g = hash13(i + vec3(0, 1, 1)), h = hash13(i + vec3(1, 1, 1));
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, f2, u.x), mix(g, h, u.x), u.y), u.z);
}
float fbm3(vec3 p, int oct) { float s = 0., a = .5; for (int i = 0; i < 7; i++) { if (i >= oct) break; s += a * vnoise3(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }

// 海面高度：一组方向不同的「尖峰波」叠加（exp(sin) 让波峰尖、波谷平），每一层把采样点往波的方向拖一点，模拟浪的推挤。
// 频率越高的波跑得越慢：相速度来自深水色散关系 ω² = g k。
float sea(vec2 p, int iters) {
  float t = uTime * uSpeed, h = 0., ws = 0., w = 1., f = uFreq;
  for (int i = 0; i < 18; i++) {
    if (i >= iters) break;
    float a = uWind + sin(float(i) * 12.9898) * 1.25;
    vec2 d = vec2(cos(a), sin(a));
    float x = dot(d, p) * f + t * sqrt(9.81 * f);
    float e = exp(sin(x) - 1.);
    h += e * w; ws += w;
    p -= d * e * cos(x) * w * uChop / f * .9;
    w *= .8; f *= 1.19;
  }
  return h / ws * uAmp;
}
vec3 camRay(vec2 uv) {
  float y = uYPR.x, pi = uYPR.y, rl = uYPR.z;
  vec3 f = vec3(sin(y) * cos(pi), sin(pi), cos(y) * cos(pi));
  vec3 r = normalize(vec3(cos(y), 0., -sin(y)));
  vec3 u = cross(f, r);
  vec3 r2 = r * cos(rl) + u * sin(rl), u2 = u * cos(rl) - r * sin(rl);
  return normalize(f * uFov + uv.x * r2 + uv.y * u2);
}
vec3 starField(vec3 rd) {
  vec3 c = vec3(0);
  for (int l = 0; l < 2; l++) {
    vec3 q = rd * (110. + float(l) * 90.); vec3 id = floor(q);
    float hs = hash13(id + float(l) * 17.);
    if (hs > .975) { vec3 sp = vec3(hash13(id + 1.), hash13(id + 2.), hash13(id + 3.)) * .5 + .25; float d = length(fract(q) - sp);
      c += vec3(.8 + .2 * hash13(id + 4.), .86, 1.) * smoothstep(.22, 0., d) * (.55 + .45 * sin(uTime * (1. + hs * 3.) + hs * 40.)) * (1.6 - float(l) * .7) * pow((hs - .975) / .025, 2.); }
  }
  vec3 axis = normalize(vec3(.35, .55, -.75));
  float band = exp(-pow(dot(rd, axis), 2.) * 30.);
  float mw = fbm3(rd * 7. + 2., 5);
  c += vec3(.5, .56, .8) * band * smoothstep(.45, .8, mw) * .16;
  c -= vec3(.03) * band * smoothstep(.55, .75, fbm3(rd * 14. + 9., 4));
  return max(c, 0.);
}
vec3 sky(vec3 rd, bool refl) {
  float y = max(rd.y, 0.);
  vec3 col = mix(uSkyHor, uSkyTop, pow(y, .42));
  float sd = max(dot(rd, uSun), 0.);
  col += uSunCol * (pow(sd, 6.) * .05 + pow(sd, 48.) * .14) * (1. - uCloudDark * .8);
  if (!refl) col += uSunCol * smoothstep(1. - uSunSize, 1. - uSunSize * .6, sd) * 14. * (1. - uCloudDark);
  if (uMoonA > 0.) {
    float md = dot(rd, uMoon);
    float disk = smoothstep(.99955, .99972, md);
    vec3 mc = vec3(1., .96, .88) * (.78 + .22 * vnoise(rd.xy * 520. + 7.));
    col += uMoonA * ((refl ? 0. : 1.) * disk * mc * 3. + pow(max(md, 0.), 300.) * .3 * vec3(.75, .85, 1.) + pow(max(md, 0.), 10.) * .05 * vec3(.6, .7, 1.));
  }
  if (uStars > 0. && rd.y > 0.) col += uStars * starField(rd) * smoothstep(0., .12, rd.y);
  if (uCloud > 0. && rd.y > .005) {
    vec2 cp = rd.xz / (rd.y + .06) * .9 + uTime * vec2(.012, .004) * uSpeed;
    float c = fbm(cp * 1.4, 6);
    c = smoothstep(1. - uCloud, 1. - uCloud + .32, c + .12);
    float lit = .55 + .45 * pow(sd, 2.);
    vec3 cc = mix(uSkyHor * 1.05 + uSunCol * .04, vec3(.85), .28) * lit;
    cc = mix(cc, vec3(.05, .055, .065), uCloudDark);
    col = mix(col, cc, c * smoothstep(.005, .16, rd.y) * .92);
  }
  col += uFlash * vec3(.7, .78, 1.) * (.35 + .65 * smoothstep(0., .45, rd.y));
  return col;
}
vec3 shadeSea(vec3 p, vec3 n, vec3 rd, float dist) {
  float fres = clamp(.02 + .98 * pow(1. - max(dot(n, -rd), 0.), 5.), 0., .85);
  vec3 r = reflect(rd, n); r.y = abs(r.y);
  vec3 refl = sky(r, true);
  float hN = clamp(p.y / max(uAmp, .01), 0., 1.);
  vec3 water = uDeep + uShallow * pow(hN, 2.2) * (.35 + .65 * max(dot(uSun, -rd) * .5 + .5, 0.)) * .55;
  water += uShallow * pow(max(dot(rd, uSun), 0.), 4.) * .45 * hN;
  vec3 col = mix(water, refl, fres);
  col += uSunCol * pow(max(dot(r, uSun), 0.), 500.) * 5. * (1. - uCloudDark);
  col += uSunCol * pow(max(dot(r, uSun), 0.), 40.) * .15 * (1. - uCloudDark);
  if (uMoonA > 0.) col += vec3(.75, .82, 1.) * (pow(max(dot(r, uMoon), 0.), 260.) * 2.4 + pow(max(dot(r, uMoon), 0.), 30.) * .12) * uMoonA;
  float fo = smoothstep(.58, .95, hN + (vnoise(p.xz * .7 + uTime * .25) - .5) * .35) * uChop;
  col = mix(col, vec3(.8, .86, .92) * (.12 + .88 * clamp(uSun.y * 2., 0., 1.) * (1. - uCloudDark * .7) + uFlash), fo * .55);
  col += uGlow * vec3(.05, .75, 1.) * fo * (.4 + .6 * vnoise(p.xz * 2. + uTime * 2.)) * 1.6;
  return col;
}
vec3 aboveWater(vec3 ro, vec3 rd) {
  vec3 col;
  float tTop = max((uAmp * 1.05 - ro.y) / min(rd.y, -1e-4), 0.), tBot = min((0. - ro.y) / min(rd.y, -1e-4), 9000.);
  if (rd.y > -.0005) return sky(rd, false);
  float a = tTop, b = tBot;
  vec3 pa = ro + rd * a, pb = ro + rd * b;
  float ha = pa.y - sea(pa.xz, 6), hb = pb.y - sea(pb.xz, 6), m = a;
  for (int i = 0; i < 12; i++) {
    m = mix(a, b, ha / (ha - hb));
    vec3 q = ro + rd * m; float hm = q.y - sea(q.xz, 6);
    if (hm < 0.) { b = m; hb = hm; } else { a = m; ha = hm; }
  }
  vec3 p = ro + rd * m;
  float e = max(.03, m * .0016);
  int it = int(mix(16., 7., clamp(m / 2500., 0., 1.)));
  float h = sea(p.xz, it);
  vec3 n = normalize(vec3(h - sea(p.xz + vec2(e, 0), it), e, h - sea(p.xz + vec2(0, e), it)));
  n = normalize(mix(n, vec3(0, 1, 0), clamp(m / 9000., 0., 1.)));
  col = shadeSea(p, n, rd, m);
  vec3 hr = normalize(vec3(rd.x, .002, rd.z));
  col = mix(col, sky(hr, true), 1. - exp(-m * uFog));
  return col;
}
vec3 underWater(vec3 ro, vec3 rd) {
  float depth = uDepth;
  float L = exp(-depth * .014);
  vec3 base = mix(uDeep * .25, uShallow * .9, smoothstep(-.7, 1., rd.y)) * L;
  vec3 col = base;
  if (rd.y > 0.) {
    float s = depth / rd.y;
    vec3 p = ro + rd * s;
    float e = .6;
    float h = sea(p.xz, 7);
    vec3 n = normalize(vec3(h - sea(p.xz + vec2(e, 0), 7), e, h - sea(p.xz + vec2(0, e), 7)));
    vec3 tr = refract(rd, -n, 1.33);
    vec3 surf = dot(tr, tr) < .01 ? uShallow * .35 : sky(normalize(vec3(tr.x, abs(tr.y), tr.z)), true) * .45;
    col = mix(col, surf, exp(-s * .03));
  }
  // 光柱：沿视线采样，把每个点投影到海面上看焦散
  float ray = 0.;
  vec3 sdir = normalize(vec3(uSun.x * .5, 1., uSun.z * .5));
  for (int i = 0; i < 20; i++) {
    float s = (float(i) + .5) * 4.;
    vec3 q = ro + rd * s;
    if (q.y > 0.) break;
    vec2 sp = q.xz - sdir.xz / sdir.y * q.y;
    float c = 1. - abs(vnoise(sp * .09 + uTime * .05) * 2. - 1.);
    c = pow(c, 7.) + pow(1. - abs(vnoise(sp * .21 - uTime * .07) * 2. - 1.), 9.) * .6;
    ray += c * exp(q.y * .02) * exp(-s * .018);
  }
  col += uShallow * ray * .05 * L;
  return col;
}
vec3 rotY(vec3 p, float a) { float c = cos(a), s = sin(a); return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z); }
vec3 planet(vec3 ro, vec3 rd) {
  vec3 col = starField(rd) * .7;
  float b = dot(ro, rd), c = dot(ro, ro) - 1., h = b * b - c;
  float dmin = length(ro - rd * b);
  if (h > 0.) {
    float t = -b - sqrt(h); vec3 p = ro + rd * t, n = normalize(p);
    vec3 q = rotY(n, uTime * .04);
    float land = fbm3(q * 2.1 + 3.1, 6);
    float isLand = smoothstep(.57, .6, land);
    float ice = smoothstep(.8, .9, abs(q.y) + (land - .5) * .25);
    vec3 ocean = mix(vec3(.004, .02, .09), vec3(.01, .08, .2), smoothstep(.4, .57, land));
    vec3 ground = mix(vec3(.06, .13, .04), vec3(.3, .22, .12), smoothstep(.6, .72, land));
    vec3 alb = mix(ocean, ground, isLand); alb = mix(alb, vec3(.85), ice);
    float cl = smoothstep(.52, .78, fbm3(rotY(n, uTime * .055) * 3.3 + vec3(0, 0, uTime * .01), 6));
    float dif = max(dot(n, uSun), 0.);
    vec3 cc = alb * dif * 1.3;
    vec3 r = reflect(rd, n);

function chapter(sc, lt) {
  if (!sc.ch) return;
  const a0 = sc.chAt ?? .6, a = win(lt, a0, a0 + 4.5, .8, 1); if (a <= 0) return;
  const [n, zh, en] = sc.ch, y = sc.lb ? 62 : 90;
  text(n, 90, y, { size: 30, font: F_LAT, align: 'left', alpha: a, color: '#cfe6f2' });
  text(zh, 160, y, { size: 30, weight: 900, align: 'left', alpha: a, ls: 8 });
  text(en, 160 + 30 * zh.length + 8 * zh.length + 20, y + 2, { size: 16, font: F_LAT, style: 'italic', align: 'left', alpha: a * .7, ls: 6 });
}
function subtitles(T) {
  for (const s of SUBS) {
    if (T < s.a - .4 || T > s.b + .4) continue;
    const a = win(T, s.a, s.b, .4, .5); if (a <= 0) continue;
    text(s.zh, W / 2, 985, { size: 40, alpha: a, ls: 4, glow: 'rgba(0,0,0,.95)', blur: 14 });
    text(s.en, W / 2, 1036, { size: 22, font: F_LAT, style: 'italic', color: 'rgba(238,243,246,.7)', alpha: a, ls: 1 });
  }
}
function overlays(T, sc) {
  ctx = octx;
  const lt = T - sc.t0;
  if (sc.lb) {
    const prev = SC[SC.indexOf(sc) - 1];
    const lb = 120 * (prev && !prev.lb ? eio(lt / 1.5) : 1) * (sc.id === 'shore' ? 1 - sstep(sc.d - 2.5, sc.d, lt) * 0 : 1);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, lb); ctx.fillRect(0, H - lb, W, lb);
  }
  chapter(sc, lt); subtitles(T);
  let flash = 0; for (const [th, k] of HITS) if (T >= th && T < th + 1.2) flash += .5 * k * Math.exp(-(T - th) * 5);
  if (flash > .01) { ctx.fillStyle = `rgba(235,245,255,${Math.min(.7, flash)})`; ctx.fillRect(0, 0, W, H); }
  if (sc.id === 'shore') { const f = sstep(sc.d - 2.4, sc.d - .2, lt); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); } }
  ctx = lctx;
}
const SHUTTER = .5;
function render(T, samples = 1) {
  T = clamp(T, 0, TOTAL - 1e-4); FT = T;
  const sc = sceneAt(T), K = Math.max(1, Math.min(samples, sc.mb ?? samples));
  for (let k = 0; k < K; k++) {
    let tk = K > 1 ? Math.max(0, T + ((k + .5) / K - .5) * SHUTTER / FPS) : T;
    if (sceneAt(tk) !== sc) tk = T;
    drawLayer(tk);
    actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1 / (k + 1); actx.drawImage(LAYER, 0, 0);
  }
  actx.globalAlpha = 1;
  post(T, sc);
  overlays(T, sc);
}

// ------------------------------------------------------------------------------------- 字体、播放、导出接口
let fontsReady = false;
Promise.all(['400 40px "Noto Serif TC"', '900 40px "Noto Serif TC"', 'italic 400 40px "Noto Serif"', '400 40px "Noto Serif"', '400 40px "Noto Serif KR"', '400 40px "Noto Naskh Arabic"', '400 40px "Noto Serif Devanagari"', '400 40px "Space Mono"']
  .map(f => document.fonts.load(f, '海 sea θάλασσα 바다 بحر समुद्र 1')))
  .catch(() => {}).then(() => document.fonts.ready).then(() => { fontsReady = true; const l = document.getElementById('load'); if (l) l.textContent = '字型就緒 · 建議全螢幕（F）· 戴耳機'; render(0); });
setTimeout(() => { fontsReady = true; }, 15000);

window.__ready = () => fontsReady;
window.__frame = (t, samples = 3, png = true) => { render(t, samples); return png ? OUTC.toDataURL('image/png') : OUTC.toDataURL('image/jpeg', .92); };
window.__info = () => ({ duration: TOTAL, fps: FPS, frames: Math.round(TOTAL * FPS), bpm: BPM, gl: !!gl });
window.__cues = () => ({ bpm: BPM, bar: BAR, total: TOTAL, scenes: SC.map(s => ({ id: s.id, t0: s.t0, d: s.d, bars: s.bars, mus: s.mus, surf: s.surf, rain: s.rain || 0, under: s.under ?? null })), sfx: CUES });

const au = document.getElementById('au');
au.src = 'music.mp3';
if (EXPORT) { document.getElementById('start').remove(); document.getElementById('ui').remove(); }
else {
  let playing = false, clock0 = 0, useAudio = true, hideT = 0;
  const ui = document.getElementById('ui'), pp = document.getElementById('pp'), fillEl = document.getElementById('fill'), tm = document.getElementById('tm');
  document.getElementById('dur').textContent = `${Math.floor(TOTAL / 60)}:${String(Math.round(TOTAL % 60)).padStart(2, '0')}`;
  const now = () => useAudio ? au.currentTime : (performance.now() - clock0) / 1000;
  function loop() {
    const T = now(); render(T);
    fillEl.style.width = (T / TOTAL * 100) + '%'; tm.textContent = `${Math.floor(T / 60)}:${String(Math.floor(T % 60)).padStart(2, '0')}`;
    if (T >= TOTAL - .05) { playing = false; pp.textContent = '▶'; }
    if (playing) requestAnimationFrame(loop);
  }
  function play() { playing = true; pp.textContent = '❚❚'; au.play().catch(() => { useAudio = false; clock0 = performance.now() - au.currentTime * 1000; }); requestAnimationFrame(loop); }
  function pause() { playing = false; pp.textContent = '▶'; au.pause(); }
  document.getElementById('go').onclick = () => { document.getElementById('start').remove(); if (au.currentTime >= TOTAL - .1) au.currentTime = 0; play(); poke(); };
  pp.onclick = () => playing ? pause() : play();
  document.getElementById('bar').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); au.currentTime = clamp((e.clientX - r.left) / r.width) * TOTAL; if (!useAudio) clock0 = performance.now() - au.currentTime * 1000; if (!playing) render(au.currentTime); };
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  function poke() { ui.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => ui.classList.add('hide'), 2200); }
  addEventListener('mousemove', poke);
  addEventListener('keydown', e => {
    if (document.getElementById('start')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'KeyF') document.getElementById('fs').click();
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { au.currentTime = clamp(au.currentTime + (e.code === 'ArrowRight' ? 5 : -5), 0, TOTAL); if (!useAudio) clock0 = performance.now() - au.currentTime * 1000; if (!playing) render(au.currentTime); }
    poke();
  });
}
</script>
