<script>
'use strict';
// ======================================================================== constants, math

// ======================================================================== lyrics
const L = A.lyrics.map((l, i, a) => ({ ...l, i, e: i + 1 < a.length ? a[i + 1].t : DUR }));

// ======================================================================== canvases
const cv = document.getElementById('c');
function canvas(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function measure(c, s, size, font, ls = 0) { c.save(); c.font = `${size}px ${font}`; c.letterSpacing = ls + 'px'; const w = c.measureText(s).width; c.restore(); return w; }
// every sung line enters the same way: characters fade up one after another in time with the voice, and the
// song's own translation settles in underneath. Nothing types, blinks or pops.
function revealText(c, s, t0, t1, T, x, y, o = {}) {
  const cs = chars(s), size = o.size || 58, ls = o.ls ?? 4, d = Math.min((t1 - t0) * (o.k ?? .7), .055 * cs.length + .25);
  c.save(); c.font = `${size}px ${o.font || F.lyr}`; c.letterSpacing = ls + 'px'; c.textBaseline = 'middle'; c.textAlign = 'left';
  const w = c.measureText(s).width, x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;

  if (o.stroke) { c.lineWidth = o.lw || 8; c.strokeStyle = o.stroke; c.lineJoin = 'round'; }

  let acc = '';

    const cx = x0 + (acc ? c.measureText(acc).width : 0); acc += ch;
    const p = clamp((T - t0 - d * k / cs.length) / (o.dur ?? .18)); if (p <= 0) return;
    const e = eout(p), yy = y + (1 - e) * size * (o.rise ?? .16);

}
function sub(i, T, o = {}) {
  const l = L[i], a = lineA(i, T, o.fi ?? .08, o.fo ?? .2) * (o.alpha ?? 1); if (a <= .002) return;
  const c = o.ctx || xx, size = o.size || 58, x = o.x ?? W / 2, y = o.y ?? 925;
  c.save(); c.globalAlpha = a;

  c.restore();
  if (l.tr && o.tr !== false)
    txt(c, l.tr, x + (o.trdx || 0), y + size * .5 + (o.trGap ?? 34), { font: F.zh, size: o.trSize || 28, color: o.trColor || 'rgba(236,234,228,.85)',

// ======================================================================== smooth motion
// value noise in [-1, 1]: cameras drift and things sway on smooth curves, never on per-frame random numbers
const vnoise = (t, s = 0) => { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return lerp(hash2(i, s), hash2(i + 1, s), u) * 2 - 1; };

// a damped spring: every hit rings out and settles
function ring(arr, T, f = 6, d = 8, span = 1.2) {
  let s = 0;
  for (let i = lastIdx(arr, T); i >= 0 && T - arr[i][0] < span; i--) { const dt = T - arr[i][0]; s += arr[i][1] * Math.exp(-dt * d) * Math.sin(dt * f * TAU); }
  return s;
}
const ringAt = (times, T, f = 6, d = 8) => times.reduce((s, t) => { const dt = T - t; return dt >= 0 && dt < 1.5 ? s + Math.exp(-dt * d) * Math.sin(dt * f * TAU) : s; }, 0);
const kickShake = (T, a = .005) => [ring(A.kicks, T, 5.5, 9) * a, ring(A.kicks, T, 4.1, 9) * a * .7];

// ======================================================================== ink: everything drawn by hand is drawn with these
// a hand-inked line, tapered at both ends and slightly wavering, drawn up to fraction p
function inkLine(c, x0, y0, x1, y1, w, p = 1, seed = 1, color = '#060606') {
  if (p <= 0) return;
  const N = 28, dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy), nx = -dy / l, ny = dx / l;
  const pt = (u, side) => { const r = u / Math.max(p, 1e-3), wd = w * Math.pow(Math.sin(PI * clamp(r)), .55) * (.85 + .15 * vnoise(u * 9, seed + 3)), wob = vnoise(u * 2.5, seed) * l * .01;
    return [x0 + dx * u + nx * (wob + side * wd / 2), y0 + dy * u + ny * (wob + side * wd / 2)]; };
  c.fillStyle = color; c.beginPath();
  for (let k = 0; k <= N; k++) { const [x, y] = pt(p * k / N, 1); k ? c.lineTo(x, y) : c.moveTo(x, y); }
  for (let k = N; k >= 0; k--) { const [x, y] = pt(p * k / N, -1); c.lineTo(x, y); }
  c.closePath(); c.fill();
}
// a dry brush stroke along a polyline, painted up to fraction p: many bristles that run out at slightly different lengths
function brush(c, pts, w, p, seed = 1, color = '#f3f2ee', B = 30) {
  if (p <= 0) return;
  const seg = [], L0 = [0];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L0.push(L0[i - 1] + d); }
  const tot = L0[L0.length - 1];
  const at = u => { const d = u * tot; let i = 1; while (i < L0.length - 1 && L0[i] < d) i++; const f = (d - L0[i - 1]) / (seg[i - 1] || 1), a = pts[i - 1], b = pts[i];
    const tx = (b[0] - a[0]) / (seg[i - 1] || 1), ty = (b[1] - a[1]) / (seg[i - 1] || 1); return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), -ty, tx]; };

// a black brush stroke sweeping across the frame: it covers the old shot by p = .5 and uncovers the new one by p = 1
function inkWipe(c, p, seed = 1, ang = -.18) {
  if (p <= 0 || p >= 1) return;
  const lead = eio(clamp(p * 2)) * 1.55 - .28, tail = eio(clamp(p * 2 - 1)) * 1.55 - .28, N = 54, y0 = -520, y1 = H + 520;
  const edge = (u, side, k) => [u * W + (vnoise(k * .55, seed + side * 11) * 46 + vnoise(k * 2.7, seed + side * 13 + 5) * 18) * (side ? 1 : -1), lerp(y0, y1, k / N)];

  c.fillStyle = '#050505'; c.beginPath();
  for (let k = 0; k <= N; k++) { const [x, y] = edge(lead, 1, k); k ? c.lineTo(x, y) : c.moveTo(x, y); }
  for (let k = N; k >= 0; k--) { const [x, y] = edge(tail, 0, k); c.lineTo(x, y); }
  c.closePath(); c.fill();
  c.strokeStyle = '#050505'; c.lineCap = 'round';

// a manga speech balloon: slightly irregular hand-drawn ellipse with a tail pointing at (tail)
function balloon(c, cx, cy, w, h, tail, p, seed = 1) {
  if (p <= 0) return;

// concentration lines (集中线) converging on (cx, cy); regenerated per beat by changing seed
function focusLines(c, cx, cy, r0, seed, o = {}) {
  const n = o.n ?? 160;

// one rose petal; spin flips it like it is tumbling through the air

// break both layers into manga panels along straight cuts; pieces slide apart by d and the gaps show black gutter

function shade(y, a = .7, h = 150) {

// ======================================================================== WebGL: halftone print + grading + glitch, composited with the sharp layer
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false });

in vec2 p; out vec2 vUv; void main() { vUv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;

uniform vec2 uRes, uShift, uLev;

  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'copy'; g.drawImage(FIG, 0, 0); g.globalCompositeOperation = 'destination-out';
  const gr = g.createLinearGradient(front - 70, 0, front + 30, 0); gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, front + 30, 1000);
  g.drawImage(SPECK, front - 10, 0, 220, 1000);
  g.globalCompositeOperation = 'source-over';
  drawFig(c, FIGBUF, fx, fy, s);
  c.save(); c.fillStyle = '#0a0a0a';
  for (let i = 0; i < 240; i++) {
    const born = hash1(i * 2.7 + seed), age = prog - born; if (age < 0 || age > .35) continue;
    const y0 = lerp(330, 1000, hash1(i * 5.9 + seed)), x0 = lerp(430, 1060, born), k = age / .35;
    const x = fx + (x0 - 735 + k * (200 + 500 * hash1(i * 1.3 + seed))) * s, y = fy + (y0 - 1000 - k * 80 * hash1(i * 8.1 + seed)) * s;
    c.globalAlpha = 1 - k; c.beginPath(); c.arc(x, y, (2 + 5 * hash1(i * 3.9 + seed)) * (1 - k * .5), 0, TAU); c.fill();
  }
  c.restore();
}
// a panel of a manga page: black-bordered window onto a slowly drifting cover crop
function panel(c, x, y, w, h, cr, T, o = {}) {
  const p = o.p ?? 1; if (p <= 0) return;
  const e = eout(p), dx = (o.from?.[0] ?? 0) * (1 - e), dy = (o.from?.[1] ?? 0) * (1 - e);
  c.save(); c.globalAlpha *= clamp(p * 1.6); c.translate(dx, dy);
  c.beginPath(); c.rect(x, y, w, h); c.clip();
  const [dxn, dyn] = drift(T, cr[2] * .03, .25, o.seed ?? 1), z = 1 + (o.zoom ?? .05) * clamp((T - (o.t0 ?? T)) / 4);
  const cw = cr[2] / z, ch = cr[3] / z;
  drawCrop(c, o.img || CV, [cr[0] + (cr[2] - cw) / 2 + dxn, cr[1] + (cr[3] - ch) / 2 + dyn, cw, ch], x, y, w, h);
  c.restore();
  c.save(); c.globalAlpha *= clamp(p * 1.6); c.translate(dx, dy); c.strokeStyle = '#050505'; c.lineWidth = 7; c.strokeRect(x, y, w, h); c.restore();
}
// circle of points for brush strokes
const circlePts = (cx, cy, r, a0, a1, n = 40, wob = 0, seed = 1) => Array.from({ length: n + 1 }, (_, k) => { const a = lerp(a0, a1, k / n), rr = r * (1 + wob * vnoise(k * .4, seed)); return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]; });

scene(0, [0, 1, 2], (T, lt, P) => {

  const [dxp, dyp] = drift(T, 10, .2, 3), rot = -.05 + .012 * vnoise(T * .3, 8);
  sx.save(); sx.translate(W / 2 + dxp, H / 2 - 40 + dyp); sx.rotate(rot);
  // the print sheds its dots: they lift off the edges and drift away
  sx.fillStyle = '#e9e6de';
  for (let i = 0; i < 240; i++) {
    const b = hash1(i * 3.3) * 5.4, age = T - b; if (age < 0 || age > 2.6) continue;
    const side = Math.floor(hash1(i * 1.1) * 4), u = hash1(i * 7.7) - .5, k = age / 2.6;

    for (let k = 0; k < 8; k++) { const off = vnoise(T * 5 + k * 1.7, 5) * 60 * rew; drawCrop(sx, CV, [380, 260 + k * 620 / 8, 620, 620 / 8], -s / 2 + off, -s / 2 + k * s / 8, s, s / 8 + 1); }
  } else drawCrop(sx, CV, [380, 260, 620, 620], -s / 2, -s / 2, s, s);

  if (rew > 0) tracking(xx, T, rew * .8);

}, (T) => ({ col: .45, tint: AGED, scan: .25 + .3 * win(T, 2.8, 4.16, .12, .12), glitch: .12 * win(T, 2.8, 4.16, .1, .2),

function titleCard(T, t0, o = {}) {

    xx.save(); xx.globalAlpha *= eout(ap);

  xx.fillStyle = RED; xx.fillRect(W / 2 - tot / 2, H / 2 + bh / 2 + 4, tot * eio(clamp((lt - .25) / .6)), 14);
  if (o.credits !== false) {

}

// ---- 07 writing the future on manuscript paper ------------------------------------------------------------- 0:23.4 - 0:30.1
const GRID = { x0: 260, y0: 150, cell: 100, cols: 14, rows: 8 };
function brushRow(c, s, t0, t1, row, col0, T, o = {}) {
  const cs = chars(s), d = Math.min((t1 - t0) * .8, cs.length * .14);
  cs.forEach((ch, k) => {
    const tk = t0 + k * d / cs.length, p = clamp((T - tk) / .16); if (p <= 0) return;
    const x = GRID.x0 + (col0 + k + .5) * GRID.cell, y = GRID.y0 + (row + .5) * GRID.cell;
    c.save(); c.beginPath(); c.rect(x - 60, y - 60, 120, 120 * eout(p)); c.clip();
    txt(c, ch, x, y + 4, { font: F.brush, size: 88, color: (o.red && o.red.includes(k)) ? RED : (o.color || '#141210'), sc: 1 + .1 * (1 - eout(p)) });
    c.restore();
  });
}
function blob(c, cx, cy, r, T) {
  c.beginPath();
  for (let i = 0; i <= 96; i++) {
    const a = i / 96 * TAU, rr = r * (1 + .16 * Math.sin(3 * a + T * .7) + .09 * Math.sin(7 * a - T * 1.3) + .05 * Math.sin(13 * a + 2.1) + .04 * Math.sin(23 * a - T));
    i ? c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : c.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  c.closePath(); c.fill();
}

  pp.onclick = () => playing ? pause() : play();
  document.getElementById('bar').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); au.currentTime = clamp((e.clientX - r.left) / r.width) * DUR; if (!useAudio) clock0 = performance.now() - au.currentTime * 1000; if (!playing) frame(au.currentTime); };
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  function poke() { ui.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => ui.classList.add('hide'), 2200); }
  addEventListener('mousemove', poke);
  addEventListener('keydown', e => {
    if (document.getElementById('start')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'KeyF') document.getElementById('fs').click();
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { au.currentTime = clamp(au.currentTime + (e.code === 'ArrowRight' ? 5 : -5), 0, DUR); if (!playing) frame(au.currentTime); }
    poke();
  });
}
</script>
</body>
</html>
