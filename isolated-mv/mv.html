'use strict';
// ======================================================================== constants, math

// ======================================================================== canvases
const cv = document.getElementById('c');
function canvas(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const sx = S.getContext('2d'), xx = X.getContext('2d'), tx = TMP.getContext('2d');

  c.save(); c.font = `${size}px ${o.font || F.lyr}`; c.letterSpacing = ls + 'px'; c.textBaseline = 'middle'; c.textAlign = 'left';
  const w = c.measureText(s).width, x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;

  let acc = '';

}
// two voices: dangao_w sings from 我试着再忘记你一次 to back to you, yuki; everything else is YuKIluv7
const VOICES = [[0, 'YuKIluv7'], [56.48, 'dangao_w'], [90.40, 'YuKIluv7']];
const isDangao = T => T >= 56.48 && T < 90.40;
const TOBACCO = [1.05, .97, .84];                                     // his part looks like paper kept in a smoker's room
function sub(i, T, o = {}) {
  const l = L[i], a = lineA(i, T, o.fi ?? .08, o.fo ?? .2) * (o.alpha ?? 1); if (a <= .002) return;
  const c = o.ctx || xx, size = o.size || 58, x = o.x ?? W / 2, y = o.y ?? 925;
  c.save(); c.globalAlpha = a;
  revealText(c, l.text, l.t, l.e, T, x, y, { ...o, size, ls: o.ls ?? (isZh(l.text) ? 8 : 2) });
  c.restore();
  if (l.tr && o.tr !== false)
    txt(c, l.tr, x + (o.trdx || 0), y + size * .5 + (o.trGap ?? 34), { font: F.zh, size: o.trSize || 28, color: o.trColor || 'rgba(236,234,228,.85)',

}

// ======================================================================== smooth motion
// value noise in [-1, 1]: cameras drift and things sway on smooth curves, never on per-frame random numbers
const vnoise = (t, s = 0) => { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return lerp(hash2(i, s), hash2(i + 1, s), u) * 2 - 1; };

// a damped spring: every hit rings out and settles
function ring(arr, T, f = 6, d = 8, span = 1.2) {
  let s = 0;
  for (let i = lastIdx(arr, T); i >= 0 && T - arr[i][0] < span; i--) { const dt = T - arr[i][0]; s += arr[i][1] * Math.exp(-dt * d) * Math.sin(dt * f * TAU); }
  return s;
}
const ringAt = (times, T, f = 6, d = 8) => times.reduce((s, t) => { const dt = T - t; return dt >= 0 && dt < 1.5 ? s + Math.exp(-dt * d) * Math.sin(dt * f * TAU) : s; }, 0);
const kickShake = (T, a = .005) => [ring(A.kicks, T, 5.5, 9) * a, ring(A.kicks, T, 4.1, 9) * a * .7];

// ======================================================================== ink: everything drawn by hand is drawn with these
// a hand-inked line, tapered at both ends and slightly wavering, drawn up to fraction p
function inkLine(c, x0, y0, x1, y1, w, p = 1, seed = 1, color = '#060606') {
  if (p <= 0) return;
  const N = 28, dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy), nx = -dy / l, ny = dx / l;
  const pt = (u, side) => { const r = u / Math.max(p, 1e-3), wd = w * Math.pow(Math.sin(PI * clamp(r)), .55) * (.85 + .15 * vnoise(u * 9, seed + 3)), wob = vnoise(u * 2.5, seed) * l * .01;
    return [x0 + dx * u + nx * (wob + side * wd / 2), y0 + dy * u + ny * (wob + side * wd / 2)]; };

  for (let k = 0; k <= N; k++) { const [x, y] = pt(p * k / N, 1); k ? c.lineTo(x, y) : c.moveTo(x, y); }
  for (let k = N; k >= 0; k--) { const [x, y] = pt(p * k / N, -1); c.lineTo(x, y); }
  c.closePath(); c.fill();
}
// a dry brush stroke along a polyline, painted up to fraction p: many bristles that run out at slightly different lengths
function brush(c, pts, w, p, seed = 1, color = '#f3f2ee', B = 30) {
  if (p <= 0) return;

  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L0.push(L0[i - 1] + d); }
  const tot = L0[L0.length - 1];
  const at = u => { const d = u * tot; let i = 1; while (i < L0.length - 1 && L0[i] < d) i++; const f = (d - L0[i - 1]) / (seg[i - 1] || 1), a = pts[i - 1], b = pts[i];
    const tx = (b[0] - a[0]) / (seg[i - 1] || 1), ty = (b[1] - a[1]) / (seg[i - 1] || 1); return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), -ty, tx]; };

    if (run <= start) continue;

    c.stroke();
  }

}
// a black brush stroke sweeping across the frame: it covers the old shot by p = .5 and uncovers the new one by p = 1
function inkWipe(c, p, seed = 1, ang = -.18) {

  for (let k = N; k >= 0; k--) { const [x, y] = edge(tail, 0, k); c.lineTo(x, y); }

// a manga speech balloon: slightly irregular hand-drawn ellipse with a tail pointing at (tail)
function balloon(c, cx, cy, w, h, tail, p, seed = 1) {
  if (p <= 0) return;

// concentration lines (集中线) converging on (cx, cy); regenerated per beat by changing seed
function focusLines(c, cx, cy, r0, seed, o = {}) {

// break both layers into manga panels along straight cuts; pieces slide apart by d and the gaps show black gutter

function shade(y, a = .7, h = 150) {
  const g = sx.createLinearGradient(0, y - h, 0, y + h);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');

// ======================================================================== WebGL: halftone print + grading + glitch, composited with the sharp layer

in vec2 p; out vec2 vUv; void main() { vUv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;

precision highp float;
in vec2 vUv; out vec4 o;

  const b = (T - MONT) / BEAT, slot = b < 8 ? Math.floor(b) : b < 14 ? 8 + Math.floor((b - 8) * 2) : -1;
  if (slot < 0) {                                                     // the last two beats: the title again
    sx.fillStyle = '#000'; sx.fillRect(0, 0, W, H); snow(sx, T, { n: 160, speed: 120, r: 5, alpha: .8 });
    titleCard(T, MONT + 14 * BEAT, { credits: false, jit: 1.5 });
    Object.assign(P, { ht: 1, zoom: 1 + .02 * pulse(A.kicks, T) });
    return;
  }
  const t0 = b < 8 ? MONT + slot * BEAT : MONT + 8 * BEAT + (slot - 8) * BEAT / 2;
  const ts = MOTIFS[slot % MOTIFS.length] + (T - t0) * .7, sc = sceneAt(ts);
  Object.assign(P, POST0, sc.post ? sc.post(ts, ts - sc.t0) : {}, { col: 0, split: -1, fade: 0, fadeW: 0 });
  sc.draw(ts, ts - sc.t0, P);
  P.flash = Math.max(P.flash, .2 * Math.exp(-(T - t0) * 14));
  const k = kickShake(T, .004); P.shift = [P.shift[0] + k[0], P.shift[1] + k[1]];
}, () => ({}));

// ---- 19b outro: snow on the city; its windows go out one by one, the circled one last ---------------------------------------------- 1:53.0 - end
scene(OUTRO, [], (T, lt, P) => {
  backdrop(sx, 2, T, { a: [.4, .6, 1, 0], moon: [.78, .74, .045] });
  const base = H + 120 - 40 * eio(clamp(lt / 9)), pan = 500 + lt * 4, off = 1 - eio(clamp((lt - 1) / 6));
  const lastOut = DUR - 3 - OUTRO, litA = 1 - sstep(lastOut, lastOut + .5, lt);
  skyline(sx, T, { base, pan, lights: off, lit: FAR, litA });
  if (litA > 0) {                                                     // the window from "tell me what's ur target" keeps its light the longest
    const [mx, my] = skyMark(FAR[0], FAR[1], FAR[2], base, pan), g = sx.createRadialGradient(mx, my, 0, mx, my, 70);
    g.addColorStop(0, `rgba(255,255,255,${.25 * litA})`); g.addColorStop(1, 'rgba(255,255,255,0)'); sx.fillStyle = g; sx.fillRect(mx - 70, my - 70, 140, 140);
  }
  smoke(sx, T, { src: [[400, H + 200], [1300, H + 260]], rise: 900, alpha: .14, wind: 120, strands: 3, seed: 51, blur: 6 });
  snow(sx, T, { n: 260, speed: 55, r: 6, alpha: .95, wind: 8, seed: 5 });
  const ca = win(T, OUTRO + 2.5, DUR - 1.2, .9, 1.4);
  if (ca > 0) {
    txt(xx, 'ISOLATED', 170, 250, { font: F.big, size: 132, ls: 30, align: 'left', color: '#f2f0ea', alpha: ca });   // cold, upright, widely tracked
    xx.fillStyle = RED; xx.globalAlpha = ca; xx.fillRect(176, 330, 220 * eio(clamp((T - OUTRO - 2.7) / .8)), 8); xx.globalAlpha = 1;
    txt(xx, 'YuKIluv7 / dangao_w', 176, 400, { font: F.mono, size: 34, align: 'left', ls: 2, color: '#e6e4de', alpha: ca });
    txt(xx, 'De4thpain · 2026', 176, 460, { font: F.mono, size: 26, align: 'left', ls: 4, color: '#a8a6a0', alpha: ca });
    CREDITS.forEach(([k, v], i) => { txt(xx, k, 176, 540 + i * 40, { font: F.zh, size: 22, align: 'left', ls: 6, color: '#8f8d88', alpha: ca });
      txt(xx, v, 260, 540 + i * 40, { font: F.mono, size: 22, align: 'left', ls: 2, color: '#c9c7c1', alpha: ca }); });
  }
}, (T) => ({ grain: .035, vig: .6, fade: sstep(DUR - 2.4, DUR - .25, T) }));

// ======================================================================== frame
const sceneAt = t => { let s = SC[0]; for (const c of SC) if (t >= c.t0) s = c; return s; };
const DROPS = [4.156, 37.651, 68.348, 93.46];
function frame(T) {
  T = clamp(T, 0, DUR - 1e-3);
  for (const c of [sx, xx]) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.filter = 'none'; c.letterSpacing = '0px'; }
  sx.fillStyle = '#000'; sx.fillRect(0, 0, W, H); xx.clearRect(0, 0, W, H);
  const sc = sceneAt(T), lt = T - sc.t0;
  const P = { ...POST0, ...(sc.post ? sc.post(T, lt) : {}) };
  if (isDangao(T)) { const k = sstep(56.48, 57.3, T) * (1 - sstep(89.6, 90.4, T)); P.col = Math.max(P.col, .5 * k); P.tint = TOBACCO; P.grain += .02 * k; }
  sc.draw(T, lt, P);
  xx.setTransform(1, 0, 0, 1, 0, 0); xx.globalAlpha = 1; xx.globalCompositeOperation = 'source-over';
  for (const [t0, who] of VOICES) {
    const d = T - t0 - (t0 ? .3 : 1.0), a = sstep(0, .6, d) * (1 - sstep(3.2, 4.2, d)); if (a <= 0) continue;
    xx.save(); xx.globalAlpha = a; xx.fillStyle = RED; xx.fillRect(84, 64, 34 * eout(clamp(d / .6)), 3); xx.restore();
    txt(xx, who, 132, 66, { font: F.mono, size: 26, ls: 6, align: 'left', color: '#d9d7d1', alpha: a });
  }
  for (const s of SC) if (s.wipe) { const p = (T - s.t0) / s.wipe + .5; if (p > 0 && p < 1) inkWipe(xx, p, s.t0 * 7.3); }
  for (const d of DROPS) if (T >= d && T < d + 1) P.flash = Math.max(P.flash, .85 * Math.exp(-(T - d) * 7));
  render(T, P);
}

// ======================================================================== fonts, playback, export hooks
let ready = false;
const FAMILIES = { 'Noto Serif SC': 'NSC', 'Noto Serif SC Black': 'NSCB', 'Zhi Mang Xing': 'ZMX', 'Cormorant': 'CORM', 'Anton': 'ANTON', 'Space Mono': 'MONO', 'Space Mono Bold': 'MONOB' };
const b64buf = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };
const loading = Promise.all([
  ...Object.entries(FAMILIES).map(([k, fam]) => new FontFace(fam, b64buf(A.fonts[k])).load().then(f => document.fonts.add(f))),
]).then(() => { prepAssets(); ready = true; frame(EXPORT ? 0 : 7.6); const l = document.getElementById('load'); if (l) l.textContent = '建议全屏观看（F）· 空格暂停'; })
  .catch(e => console.error('asset load failed', e));

window.__ready = () => ready;
window.__frame = t => { frame(t); return cv.toDataURL('image/png'); };
window.__duration = DUR;
window.__check = () => {
  const seen = new Map(), out = [];
  SC.forEach(s => s.lines.forEach(i => seen.set(i, (seen.get(i) || 0) + 1)));
  L.forEach((l, i) => { if (!seen.has(i)) out.push(`lyric ${i} "${l.text}" is not shown by any scene`); });
  for (let i = 1; i < SC.length; i++) if (SC[i].t0 <= SC[i - 1].t0) out.push(`scene ${i} starts before scene ${i - 1}`);
  for (const k of Object.values(FAMILIES)) if (!document.fonts.check(`40px "${k}"`)) out.push(`font ${k} not loaded`);
  return out;
};

const au = document.getElementById('au');
au.src = (window.EMBED && window.EMBED.audio) ? 'data:audio/mpeg;base64,' + window.EMBED.audio : 'Isolated.mp3';
if (EXPORT) { document.getElementById('start').remove(); document.getElementById('ui').remove(); }
else {
  let playing = false, clock0 = 0, useAudio = true, hideT = 0;
  const ui = document.getElementById('ui'), pp = document.getElementById('pp'), fill = document.getElementById('fill'), tm = document.getElementById('tm');
  const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  document.getElementById('dur').textContent = fmt(DUR);
  const now = () => useAudio ? au.currentTime : (performance.now() - clock0) / 1000;
  function loop() {
    const T = now(); frame(T);
    fill.style.width = (T / DUR * 100) + '%'; tm.textContent = fmt(T);
    if (T >= DUR - .05) { playing = false; pp.textContent = '▶'; }
    if (playing) requestAnimationFrame(loop);
  }
  function play() { playing = true; pp.textContent = '❚❚'; au.play().catch(() => { useAudio = false; clock0 = performance.now() - au.currentTime * 1000; }); requestAnimationFrame(loop); }
  function pause() { playing = false; pp.textContent = '▶'; au.pause(); }
  document.getElementById('go').onclick = () => loading.then(() => { document.getElementById('start').remove(); if (au.currentTime >= DUR - .1) au.currentTime = 0; play(); poke(); });
  pp.onclick = () => playing ? pause() : play();
  document.getElementById('bar').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); au.currentTime = clamp((e.clientX - r.left) / r.width) * DUR; if (!useAudio) clock0 = performance.now() - au.currentTime * 1000; if (!playing) frame(au.currentTime); };
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  function poke() { ui.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => ui.classList.add('hide'), 2200); }
  addEventListener('mousemove', poke);
  addEventListener('keydown', e => {
    if (document.getElementById('start')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'KeyF') document.getElementById('fs').click();
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { au.currentTime = clamp(au.currentTime + (e.code === 'ArrowRight' ? 5 : -5), 0, DUR); if (!playing) frame(au.currentTime); }
    poke();
  });
}
</script>
