org.gradle.jvmargs=-Xmx2048m
# 沙箱默认 Java 25 无法被 Kotlin 1.9 解析，固定用 mise 安装的 Java 17
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
android.useAndroidX=true
kotlin.code.style=official
# 沙箱经本地 HTTP 代理出网（与本机 curl 同一出口），强制 IPv4，避免 dl.google.com 解析 IPv6 超时
java.net.preferIPv4Stack=true
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.local
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.local
